<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon / App Icons -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: Title -->
    <title>Kayseri LGS Özel Ders | Fen Bilgisi ve Matematik | Saim Ünsal</title>

    <!-- SEO: Meta Description
         DİKKAT: src/data/site.js > PAGE_DESCRIPTION ile birebir aynı olmalıdır.
         Ayrışırsa scripts/prerender.mjs build'i hata ile durdurur. -->
    <meta name="description" content="Kayseri'de LGS, 5, 6 ve 7. sınıf öğrencilerine birebir Fen Bilgisi ve Matematik özel dersi. Erciyes Üniversitesi mezunu, 10 yıllık tecrübeli öğretmenle Maarif modeline uygun eğitim. Melikgazi, Kocasinan, Talas, Hacılar, İncesu bölgelerinde hizmet." />

    <!-- SEO: Author & Robots -->
    <meta name="author" content="Saim Ünsal" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <link rel="canonical" href="https://kayserilgsozelders.com/" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn paylaşımları) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kayseri LGS Özel Ders | Fen Bilgisi ve Matematik" />
    <meta property="og:description" content="Kayseri'de 10 yıllık tecrübeyle LGS, 5, 6 ve 7. sınıflara birebir Fen Bilgisi ve Matematik özel dersi. Maarif modeline uygun eğitim." />
    <meta property="og:url" content="https://kayserilgsozelders.com/" />
    <meta property="og:site_name" content="Kayseri LGS Özel Ders" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:image" content="https://kayserilgsozelders.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="Kayseri LGS Özel Ders - Saim Ünsal, Fen Bilgisi ve Matematik birebir ders" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kayseri LGS Özel Ders | Fen Bilgisi ve Matematik" />
    <meta name="twitter:description" content="Kayseri'de 10 yıllık tecrübeyle LGS, 5, 6 ve 7. sınıflara birebir Fen Bilgisi ve Matematik özel dersi." />
    <meta name="twitter:image" content="https://kayserilgsozelders.com/og-image.jpg" />
    <meta name="twitter:image:alt" content="Kayseri LGS Özel Ders - Saim Ünsal" />

    <!-- Yapılandırılmış veri (JSON-LD)
         Elle YAZILMAZ. scripts/prerender.mjs, src/data/site.js + faqData.js +
         curriculumData.js dosyalarından build sırasında üretip buraya basar. -->
    <!--json-ld-->

    <!-- LCP görselini (hero fotoğrafı) erkenden indirmeye başla -->
    <link
      rel="preload"
      as="image"
      href="/saim-photo-640.webp"
      imagesrcset="/saim-photo-320.webp 320w, /saim-photo-480.webp 480w, /saim-photo-640.webp 640w, /saim-photo-960.webp 960w, /saim-photo-1200.webp 1200w"
      imagesizes="(max-width: 768px) 88vw, 45vw"
      fetchpriority="high"
    />

    <!-- Google Fonts — yalnızca gerçekten kullanılan 5 ağırlık.
         TODO: woff2'leri kendi sunucumuza alırsak render'ı bloke eden bu iki
         üçüncü taraf bağlantısı da kalkar (.htaccess'te font cache kuralı hazır). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
